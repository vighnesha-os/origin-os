[package]
name = "origin-boot-uefi"
description = "Origin OS UEFI boot loader (x86_64-unknown-uefi)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# UEFI definitions and the logic that is unit-tested on the build host.
[lib]
path = "src/lib.rs"

# The EFI application. Build it only for x86_64-unknown-uefi (`cargo xtask build`).
[[bin]]
name = "origin-boot"
path = "src/main.rs"
test = false
bench = false

[features]
# Accept an unsigned KRN image and say so on the console (ADR-0002 B8). The xtask boot
# test builds this variant; a loader without it refuses unsigned kernels.
developer-mode = []

[dependencies]
origin-version.workspace = true
origin-boot-info.workspace = true
onbf-format.workspace = true
origin-crypto.workspace = true
onbf-merkle = { path = "../../runtime/onbf/merkle" }
origin-paging = { path = "../../framekernel/paging" }

[lints]
workspace = true
