[package]
name = "framekernel"
description = "Origin OS Framekernel (x86_64-unknown-none)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# The kernel above the framework: the logic that is unit-tested on the build host, and, for
# x86_64-unknown-none only, the boot flow and the services. `forbid(unsafe_code)` at its root.
[lib]
path = "src/lib.rs"

# The kernel image: its link root, which holds `_start` and so sits in the framework's directory
# (ADR-0011 N6). Build it only for x86_64-unknown-none; `build.rs` adds the link arguments that
# give it the ELF shape `onbf-pack` accepts.
[[bin]]
name = "framekernel"
path = "frame/entry/main.rs"
test = false
bench = false

[dependencies]
origin-abi = { path = "../runtime/abi" }
origin-boot-info.workspace = true
origin-frame = { path = "frame" }
origin-paging = { path = "paging" }
origin-version.workspace = true

[lints]
workspace = true
