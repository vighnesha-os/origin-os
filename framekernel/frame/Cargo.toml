[package]
name = "origin-frame"
description = "Origin OS Framekernel framework: the one privileged kernel crate (no_std; ADR-0011 N6)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
origin-boot-info = { path = "../../boot/info" }
origin-paging = { path = "../paging" }
origin-abi = { path = "../../runtime/abi" }
origin-sync = { path = "sync" }

# Used by `random`, which exists only in the kernel's build (`#[cfg(target_os = "none")]` in
# `src/lib.rs`). Named for that build alone, so that a host build does not carry a dependency
# it never uses (Cargo's `unused_dependencies`, since Cargo 1.100.0).
[target.'cfg(target_os = "none")'.dependencies]
origin-random.workspace = true

[lints]
workspace = true
