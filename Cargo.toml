# Origin OS workspace (CLAUDE.md §81, task T4).
#
# Each artifact is built for its own target, so plain `cargo build` / `cargo test` at the
# root only touch the host crates in `default-members`. Use the xtask for everything else:
#
#   cargo xtask check       fmt, clippy and unit tests, each crate on its correct target(s)
#   cargo xtask build       build the UEFI loader (x86_64-unknown-uefi, release)
#   cargo xtask boot-test   build, boot in QEMU + OVMF, and assert on the serial output
#   cargo xtask run         boot in QEMU with the serial console on this terminal

[workspace]
resolver = "3"
members = [
    "boot/info",
    "boot/uefi",
    "developer-tools/onbf-pack",
    "developer-tools/oidl",
    "developer-tools/onbf-sign",
    "developer-tools/xtask",
    "framekernel",
    "framekernel/frame",
    "framekernel/frame/sync",
    "framekernel/paging",
    "framekernel/syscalls",
    "runtime/abi",
    "runtime/core",
    "runtime/kernel-client",
    "runtime/onbf/format",
    "runtime/onbf/merkle",
    "runtime/onbf/verify",
    "runtime/rt",
    "runtime/rt-mem",
    "runtime/version",
    "sdk/directory",
    "security/crypto",
    "security/random",
    "services/directory",
    "tests/kernel/first-program",
    "tests/kernel/pin-program",
]
# Host-buildable crates only. The UEFI loader's and the Framekernel's binaries cannot be
# built for the host, and the ring-3 crates (`runtime/core`, `runtime/rt`,
# `runtime/kernel-client`, `tests/kernel/first-program` and `tests/kernel/pin-program`) are built
# only for the userspace triple, by `cargo xtask` with `.cargo/userspace.toml` (CLAUDE.md §11;
# tasks S4-1 and S4-2).
# `runtime/rt-mem`, the bodies of the runtime's `mem*` functions, is built for both, so the host
# can test it.
default-members = [
    "boot/info",
    "developer-tools/oidl",
    "developer-tools/onbf-pack",
    "developer-tools/onbf-sign",
    "developer-tools/xtask",
    "framekernel/frame",
    "framekernel/frame/sync",
    "framekernel/paging",
    "framekernel/syscalls",
    "runtime/abi",
    "runtime/onbf/format",
    "runtime/onbf/merkle",
    "runtime/onbf/verify",
    "runtime/rt-mem",
    "runtime/version",
    "security/crypto",
    "security/random",
]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false
# No `version` here or in any member, on purpose: the release identity lives only in
# `origin-version.toml` and reaches code through the generated `origin-version` crate
# (CLAUDE.md §62). `cargo xtask check` rejects a hand-written crate version.
license = "MIT OR Apache-2.0"

[workspace.dependencies]
origin-version = { path = "runtime/version" }
origin-boot-info = { path = "boot/info" }
origin-crypto = { path = "security/crypto" }
origin-random = { path = "security/random" }
onbf-format = { path = "runtime/onbf/format" }
onbf-merkle = { path = "runtime/onbf/merkle" }
onbf-verify = { path = "runtime/onbf/verify" }
onbf-sign = { path = "developer-tools/onbf-sign" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
# `cfg(loom)`: `cargo xtask loom` builds `origin-sync`'s tests against Loom (CLAUDE.md §73), in a
# scratch workspace of its own: nothing in this workspace depends on Loom.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)'] }

[workspace.lints.clippy]
# CLAUDE.md §13 and final rule 5: every unsafe boundary documents its invariants.
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"

[profile.release]
# One codegen unit: deterministic output (CLAUDE.md §75) and the same code shape that
# docs/toolchain/VERIFICATION.md exercised for the §10 regressions.
codegen-units = 1

# Hashing is the hot path of tests and of developer-mode boot verification; optimize it even
# in dev and test builds. The code uses explicit wrapping arithmetic, so release and debug
# semantics are identical.
[profile.dev.package.origin-crypto]
opt-level = 3

[profile.dev.package.onbf-merkle]
opt-level = 3

[profile.dev.package.onbf-sign]
opt-level = 3

# The mutation soaks walk tens of thousands of definitions.
[profile.dev.package.oidl]
opt-level = 2
