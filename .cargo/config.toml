[alias]
xtask = "run --quiet --package xtask --"

# Build the kernel and the loader with `cargo xtask`, not with `cargo build`. Beside the flags
# below, xtask gives every image build a `--remap-path-prefix` for the directory this machine's
# toolchain keeps the standard library's source in, which cannot be written here because it
# is another path on every machine (developer-tools/xtask/src/toolchain.rs, CLAUDE.md §75).
# An image built by plain `cargo build` holds that path, and so is not the image another
# machine builds. xtask also refuses to run with RUSTFLAGS, CARGO_ENCODED_RUSTFLAGS or a
# per-target RUSTFLAGS variable set (the first two replace every list below, even when empty),
# or with a variable that names another compiler, a compiler wrapper, or a linker for the
# kernel or the loader. A configuration file above the checkout, or in Cargo's home, is joined
# to this one by Cargo, and xtask does not look for one.

# CLAUDE.md §14: frame pointers on every Origin-owned freestanding image.
#
# CLAUDE.md §75: the loader's image is the same bytes from one build to the next
# (docs/research/2026-11-10-loader-reproducible-build.md). For this target rustc 1.100.0 runs
# rust-lld's COFF driver with `/DEBUG`, whatever `-C strip` says, and two links of the same
# objects then differ in the PE header's time stamp (the time of the link) and in the CodeView
# record's identifier (a hash of the PDB, which holds the path of a directory rustc creates
# under a random name for each link). The two arguments come after rustc's own, and of two
# `/DEBUG` options the linker obeys the last:
# - `/DEBUG:NONE`: no PDB, no CodeView record, and so no debug directory in the image;
# - `/TIMESTAMP:0`: the header's time stamp is zero.
# Either one alone leaves two builds different. The image then holds nothing but what
# UEFI 2.11 §2.1.1 says firmware uses: the header, the sections and the relocations.
# `/Brepro` in place of `/TIMESTAMP:0` also gives the same bytes twice, and leaves a debug
# directory with one entry (type 16) that a firmware's loader may read. `cargo xtask check`
# builds the loader twice and fails if the images differ.
[target.x86_64-unknown-uefi]
rustflags = [
    "-C", "force-frame-pointers=yes",
    "-C", "link-arg=/DEBUG:NONE",
    "-C", "link-arg=/TIMESTAMP:0",
]

# The kernel's two further code-generation options are ADR-0017 Z10's. `cargo xtask check` reads the built
# image to hold both (developer-tools/xtask/src/image.rs), because the second is a feature
# the stable compiler passes to the code generator with a warning, not one it supports.
[target.x86_64-unknown-none]
rustflags = [
    "-C", "force-frame-pointers=yes",
    # No `match` compiles to an indirect jump through a table.
    "-C", "jump-tables=no",
    # An INT3 follows every RET, so a processor that runs past one stops there. The compiler
    # warns once per crate that this feature is unknown and unstable; `cargo xtask` collapses that
    # warning to one line (developer-tools/xtask/src/expected_warning.rs).
    "-C", "target-feature=+harden-sls-ret",
    # The link arguments that give the kernel's ELF the shape `onbf-pack` converts to KRN
    # (ONBF §6.1.2, §6.5). The kernel is the one binary built for this target. For it
    # rustc 1.100.0 runs rust-lld with `-pie --eh-frame-hdr -z noexecstack --gc-sections
    # -z relro -z now -O1 --strip-debug` (observed with `--print link-args`): a PIE, but
    # without `--no-dynamic-linker` or `-z text`. The arguments below come after rustc's own,
    # so they decide the output whatever rustc's defaults become (in lld the last of two
    # opposing `-z` options wins). They are here and not in a build script because a build
    # script is built for the host, and an image's bytes then follow the kind of host that
    # builds it (TASKS item 44); `cargo xtask check` fails if the kernel's package gets one.
    #
    # The entry point is `_start` (lld's default, stated so it cannot drift).
    "-C", "link-arg=--entry=_start",
    # No PT_INTERP: nothing loads this image but the Origin boot loader.
    "-C", "link-arg=--no-dynamic-linker",
    # No text relocations: every relocation target is in a writable segment.
    "-C", "link-arg=-ztext",
    # Every PT_LOAD starts on its own 4 KiB page, in the file and in memory, so no page
    # holds two segments with different permissions (ONBF §6.1).
    "-C", "link-arg=-zseparate-loadable-segments",
    "-C", "link-arg=-zmax-page-size=4096",
    "-C", "link-arg=-zcommon-page-size=4096",
    # Full RELRO (CLAUDE.md §14, ADR-0001 default 9): rust-lld ends one PT_LOAD at the end of
    # PT_GNU_RELRO, `onbf-pack` flags it RELRO, and the boot loader applies its relocations
    # and hands it to the kernel read-only.
    "-C", "link-arg=-zrelro",
    "-C", "link-arg=-znow",
    # PT_GNU_STACK, if emitted, is not executable.
    "-C", "link-arg=-znoexecstack",
]

# The linker writes a line about itself into `.comment` of every ELF it links: the kernel's and
# each carried program's. Left to itself it writes its version and the repository its own
# build was configured with, and the pinned toolchain's rust-lld for Linux and the one for
# macOS give that repository differently. `.comment` is not loaded, but it moves the section
# table, whose offset is in the ELF header, and the first loaded segment holds the header: so
# an image built on one kind of host differed from one built on the other, in bytes that boot
# (docs/research/2026-11-11-toolchain-path-in-images.md §13). lld writes `LLD_VERSION` in
# place of its own line when that variable is set. Its source calls the variable an aid for
# testing, so `cargo xtask check` reads `.comment` in every ELF it builds and fails if the line
# there is not this one: a later linker that stopped honouring the variable fails that gate.
#
# The text names no version, so a toolchain upgrade does not make it false; the compiler
# writes its own version beside it. `force` makes this entry win over a value in the
# environment (tried with Cargo 1.100.0), and a file above the checkout cannot replace it.
# This is the one place the text is written: xtask reads it from here.
[env]
LLD_VERSION = { value = "Linker: rust-lld of the toolchain that rust-toolchain.toml pins (text from .cargo/config.toml)", force = true }
