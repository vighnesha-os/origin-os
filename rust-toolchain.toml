[toolchain]
channel = "1.100.0"
profile = "minimal"
components = ["rustfmt", "clippy", "rust-src", "llvm-tools"]
targets = [
    "x86_64-unknown-none",      # Framekernel
    "x86_64-unknown-uefi",      # UEFI boot loader
    "x86_64-unknown-linux-gnu"  # Origin userspace code generation only (CLAUDE.md §11); never Linux APIs
]
