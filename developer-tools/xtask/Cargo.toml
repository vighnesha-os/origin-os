[package]
name = "xtask"
description = "Origin OS build orchestration and QEMU boot tests (host only)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Std plus first-party crates only; no third-party dependencies (CLAUDE.md §5).
[dependencies]
origin-version.workspace = true
origin-crypto.workspace = true
onbf-format.workspace = true
onbf-merkle.workspace = true
# For the boot tests: the framebuffer console's drawing and the font (the screen-dump proof
# compares QEMU's picture against them) and the boot-info layout it reads.
framekernel = { path = "../../framekernel" }
origin-boot-info.workspace = true
# For the gate on `origin.core` (task S4-2): the definition's front end, so that what each stub
# must be is worked out here from the definition and not taken from the generator's output.
oidl = { path = "../oidl" }

# For one test of the gate on `origin.core` (task S4-2; the review of 2026-11-13, finding F5): a
# really linked image with a planted fault is described as the build describes it, and the
# gate must refuse it.
[dev-dependencies]
onbf-pack = { path = "../onbf-pack" }

[lints]
workspace = true
