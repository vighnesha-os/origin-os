[package]
name = "xtask"
description = "Origin OS build orchestration and QEMU boot tests (host only)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Std plus first-party crates only; no third-party dependencies (CLAUDE.md §5).
[dependencies]
origin-version.workspace = true
origin-crypto.workspace = true
onbf-format.workspace = true
onbf-merkle.workspace = true
# For the boot tests: the framebuffer console's drawing and the font (the screen-dump proof
# compares QEMU's picture against them) and the boot-info layout it reads.
framekernel = { path = "../../framekernel" }
origin-boot-info.workspace = true
# TEST ONLY: the configuration format of the application that plants firmware-reserved memory
# in QEMU's ACPI tables (`ORIGIN_QEMU_RESERVED`, TASKS item 40).
origin-test-reserved-memory = { path = "../../tests/emulator/reserved-memory" }

# The host tools, called in process: `xtask` starts no first-party program (ADR-0011 Amendment 4,
# T1; `cargo xtask host-tools-gate`). `oidl` generates the interface code and records its locks,
# and its front end lets the gate on `origin.core` (task S4-2) work out what each stub must be
# from the definition, not from the generator's output. `onbf-pack` converts the kernel, lays
# out `origin.core` and the carried programs, and signs the boot tests' images; `xtask` reaches
# `onbf-sign` only through it (`onbf_pack::sign`).
oidl = { path = "../oidl" }
onbf-pack = { path = "../onbf-pack" }

[lints]
workspace = true
