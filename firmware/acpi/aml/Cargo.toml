[package]
name = "origin-aml"
description = "Origin OS's AML interpreter: ACPI 6.6 chapter 20's machine language, loaded and run against a host that alone reaches hardware (ADR-0019 A3)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# `no_std` with `alloc`, and without `unsafe` (ADR-0019 A3). One dependency, in the workspace:
# `origin-acpi-tables` (TASKS 62), which checks every table `Load`, `LoadTable` and
# `DataTableRegion` are handed before a byte of it is used (TASKS item 63, step B4).
[dependencies]
origin-acpi-tables.workspace = true

