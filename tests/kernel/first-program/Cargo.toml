[package]
name = "first-program"
description = "The first Rust program in ring 3: a boot proof the kernel carries in its image and launches at a random base (task S4-1; ADR-0011 L1, L8)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

# Built only for the userspace triple, with `.cargo/userspace.toml`, by `cargo xtask`; never a
# default member. `onbf-pack carried` then describes its linker output for the kernel, which
# compiles the description in (`framekernel/src/program.rs`).
[[bin]]
name = "first-program"
path = "src/main.rs"
test = false
bench = false

[dependencies]
origin-abi = { path = "../../../runtime/abi" }
origin-kernel-client = { path = "../../../runtime/kernel-client" }
origin-rt = { path = "../../../runtime/rt" }

[lints]
workspace = true
