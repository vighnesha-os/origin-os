# Issue forms for Origin OS (decision item 371). Blank issues are off, so every report uses a form.
blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability privately
    url: https://github.com/vighnesha-os/origins/security/advisories/new
    about: Never in a public issue. SECURITY.md says what to include.
  - name: Ask a question
    url: https://github.com/vighnesha-os/origins/discussions
    about: Questions and ideas go to Discussions. Issues are for work to do.
