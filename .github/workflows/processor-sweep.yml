# The weekly processor sweep (CLAUDE.md §74). A job cannot ask GitHub for a processor, so the two
# real-CPU jobs on a pull request sample only two of the models in the fleet, and the bug fixed
# in vm::map_user showed only on Intel. This starts many short jobs, one at a time. A job on a
# processor this sweep has not booted on yet runs the boots; any other job stops in seconds.
#
# Standard runners only, free for this public repository, with no secrets (§80). Nothing here
# qualifies hardware (§74, rule 30): the devices and firmware are QEMU's, and none of these
# processors is the declared target. GitHub emails whoever last changed the schedule when a
# scheduled run fails, and stops scheduled runs after 60 days without repository activity.
name: processor-sweep

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
  # A change to this file proves itself on a short sweep, with one boot on each processor.
  pull_request:
    paths:
      - .github/workflows/processor-sweep.yml

permissions:
  contents: read

concurrency:
  group: processor-sweep
  cancel-in-progress: false

env:
  ORIGIN_QEMU_ACCEL: kvm
  ORIGIN_BOOT_TEST_TIMEOUT: 600

jobs:
  sweep:
    name: ${{ matrix.runner }} try ${{ matrix.round }}.${{ matrix.attempt }}
    strategy:
      fail-fast: false
      # One at a time, so each job can see what the jobs before it booted on. An artifact name
      # can be used once, so two boots on one processor would fail the second upload.
      max-parallel: 1
      matrix:
        runner: [ubuntu-24.04, ubuntu-26.04]
        round: ${{ fromJSON(github.event_name == 'pull_request' && '[1]' || '[1, 2, 3, 4]') }}
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Which processor is this?
        id: cpu
        run: |
          model=$(awk -F': *' '/^model name/ { print $2; exit }' /proc/cpuinfo)
          slug=$(tr 'A-Z' 'a-z' <<<"$model" | tr -cs 'a-z0-9' '-' | sed 's/^-//; s/-$//')
          echo "$model"
          { echo "model=$model"; echo "slug=$slug"; } >> "$GITHUB_OUTPUT"
      - name: What has this sweep booted on?
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: booted-*
          path: booted
          merge-multiple: true
      - name: Is this processor new to this sweep?
        id: need
        env:
          SLUG: ${{ steps.cpu.outputs.slug }}
        run: |
          if [ -e "booted/$SLUG" ]; then echo 'boot=false'; else echo 'boot=true'; fi >> "$GITHUB_OUTPUT"
      - if: steps.need.outputs.boot == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        if: steps.need.outputs.boot == 'true'
        run: bash .github/ci/install-rust.sh
      - name: Build QEMU
        if: steps.need.outputs.boot == 'true'
        run: bash .github/ci/install-qemu.sh
      - name: Let this job use KVM
        if: steps.need.outputs.boot == 'true'
        run: bash .github/ci/enable-kvm.sh
      - name: Boot on this processor
        id: boots
        if: steps.need.outputs.boot == 'true'
        run: |
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            cargo --locked xtask boot-matrix
          fi
          ORIGIN_QEMU_CPU=host ORIGIN_QEMU_SMP=4 ORIGIN_BOOT_TEST_ONLY='kernel boot' cargo --locked xtask boot-test
      - name: Record the result
        if: ${{ !cancelled() && (steps.boots.outcome == 'success' || steps.boots.outcome == 'failure') }}
        env:
          MODEL: ${{ steps.cpu.outputs.model }}
          SLUG: ${{ steps.cpu.outputs.slug }}
          OUTCOME: ${{ steps.boots.outcome }}
        run: |
          mkdir -p record
          echo "| $MODEL | $OUTCOME |" > "record/$SLUG"
      - if: ${{ !cancelled() && (steps.boots.outcome == 'success' || steps.boots.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: booted-${{ steps.cpu.outputs.slug }}
          path: record/${{ steps.cpu.outputs.slug }}
          retention-days: 7

  report:
    name: processors covered
    needs: sweep
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: booted-*
          path: booted
          merge-multiple: true
      - name: Say which processors this sweep booted on
        run: |
          if [ -z "$(ls -A booted 2>/dev/null)" ]; then
            echo '::error::this sweep booted on no processor at all' >&2
            exit 1
          fi
          {
            echo '| Processor | Boots |'
            echo '|---|---|'
            cat booted/*
          } | tee -a "$GITHUB_STEP_SUMMARY"
