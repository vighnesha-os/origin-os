# TEMPORARY: catches an Intel runner, to find why the SMEP proof sees #PF error 0x10 there.
name: diagnose-intel

on:
  pull_request:

permissions:
  contents: read

jobs:
  boot:
    name: try ${{ matrix.attempt }} on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-24.04]
        attempt: [1, 2, 3, 4, 5, 6, 7, 8]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - name: Is this an Intel runner?
        id: cpu
        run: |
          grep -m1 'model name' /proc/cpuinfo
          if grep -q GenuineIntel /proc/cpuinfo; then echo 'intel=true'; else echo 'intel=false'; fi >> "$GITHUB_OUTPUT"
      - if: steps.cpu.outputs.intel == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: steps.cpu.outputs.intel == 'true'
        run: bash .github/ci/install-rust.sh
      - if: steps.cpu.outputs.intel == 'true'
        run: bash .github/ci/install-qemu.sh
      - if: steps.cpu.outputs.intel == 'true'
        run: bash .github/ci/enable-kvm.sh
      - name: What KVM uses here
        if: steps.cpu.outputs.intel == 'true'
        run: |
          for f in /sys/module/kvm_intel/parameters/* /sys/module/kvm/parameters/*; do
            printf '%s: ' "$f"; cat "$f" 2>/dev/null || echo unreadable
          done
      - name: Boot
        if: steps.cpu.outputs.intel == 'true'
        env:
          ORIGIN_QEMU_ACCEL: kvm
          ORIGIN_BOOT_TEST_TIMEOUT: 300
        run: |
          set +e
          boot() {
            local name=$1; shift
            env "$@" cargo xtask boot-test > "/tmp/$name.log" 2>&1
            local rc=$?
            echo "$name: exit $rc" | tee -a /tmp/summary.txt
            grep -E 'SMEP diagnosis|page protection: SMEP|xtask: error' "/tmp/$name.log" | cut -c1-420
            if [ "$rc" != 0 ]; then tail -30 "/tmp/$name.log" | cut -c1-260; fi
          }
          export ORIGIN_BOOT_TEST_ONLY='kernel boot'
          for run in 1 2; do
            boot "vtd-1-$run" ORIGIN_QEMU_SMP=1
            boot "vtd-2-$run" ORIGIN_QEMU_SMP=2
            boot "vtd-4-$run" ORIGIN_QEMU_SMP=4
            boot "amd-2-$run" ORIGIN_QEMU_SMP=2 ORIGIN_QEMU_IOMMU=amd
            boot "host-4-$run" ORIGIN_QEMU_CPU=host ORIGIN_QEMU_SMP=4
          done
          boot sparse-max ORIGIN_QEMU_TOPOLOGY=x2apic
          boot sparse-intel ORIGIN_QEMU_TOPOLOGY=x2apic ORIGIN_QEMU_CPU=max,vendor=GenuineIntel
          boot bridge ORIGIN_QEMU_BRIDGE=on
          unset ORIGIN_BOOT_TEST_ONLY
          cargo xtask boot-console > /tmp/console.log 2>&1
          echo "console: exit $?" | tee -a /tmp/summary.txt
          grep -E 'passed in|xtask: error' /tmp/console.log | cut -c1-200
          echo '=== results'
          cat /tmp/summary.txt

  # Fails on purpose once every try has ended, so the pull request's monitor reports it.
  done:
    needs: boot
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    steps:
      - run: |
          echo '::error::diagnostics finished: read the try jobs'
          exit 1
