name: Public file index

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - developer-tools/public-index/**
      - .github/workflows/public-index.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-file-index-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'vighnesha-os/origin-os' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test publication boundaries and crawlable output
        run: python3 -m unittest discover -s developer-tools/public-index -p 'test_*.py' -v
      - name: Build reviewed public files only
        run: python3 developer-tools/public-index/build.py --output "$RUNNER_TEMP/public-file-site"
      - name: Upload only generated HTML and sitemap
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/public-file-site

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Recheck public visibility immediately before deployment
        run: python3 developer-tools/public-index/build.py --check-public
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy the generated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
